name: Deploy to GitHub Pages

# ゲームのWebビルド(dist/)をGitHub Pagesへ公開する。
# コードは claude/ios-game-app-dev-h425s9 ブランチにあるため、このブランチのpushで発火。
on:
  push:
    branches: ["claude/ios-game-app-dev-h425s9"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ(古いデプロイはキャンセル)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 型チェック + 相対ベース(--base=./)でビルド。サブパス配信でもアセットが解決できる
      - run: npx tsc
      - run: npx vite build --base=./
      # Pagesが未設定でもここで自動的に有効化(source=GitHub Actions)する
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
